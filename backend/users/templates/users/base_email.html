<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FaceCall{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border:1px solid #e4e4e7;">
          <tr>
            <td style="padding:20px 32px;border-bottom:1px solid #e4e4e7;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#18181b;">
              FaceCall
            </td>
          </tr>
          <tr>
            <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#3f3f46;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #e4e4e7;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#71717a;">
              {% block footer %}If you didn't request this, you can safely ignore this email.{% endblock %}
              <br>&copy; FaceCall
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
